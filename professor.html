<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Faculty Dashboard | Professor Terminal</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
		:root {
			--bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
			--card-bg: rgba(255, 255, 255, 0.03);
			--card-border: rgba(255, 255, 255, 0.08);
			--text-main: #f8fafc;
			--text-muted: #94a3b8;
		}

		* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
		body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 40px 20px; }
        
		.container { max-width: 1000px; margin: 0 auto; }
        
		.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--card-border); }
		h1 { font-size: 28px; font-weight: 700; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
		.logout-btn { padding: 10px 20px; background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
		.logout-btn:hover { background: #dc3545; transform: translateY(-1px); }

		/* Form Styling */
		.form-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--card-border); padding: 30px; border-radius: 16px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
		.form-card h3 { margin-bottom: 20px; font-size: 18px; color: #cbd5e1; }
		.form-group { display: flex; gap: 15px; }
		input { flex: 1; padding: 14px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border); border-radius: 10px; color: white; font-size: 15px; outline: none; }
		input:focus { border-color: #818cf8; }
		.add-btn { padding: 0 30px; background: linear-gradient(135deg, #34d399, #059669); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; }
		.add-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(52, 211, 153, 0.3); }

		/* Table Styling */
		.table-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
		table { width: 100%; border-collapse: collapse; text-align: left; }
		th, td { padding: 16px 20px; border-bottom: 1px solid var(--card-border); }
		th { background: rgba(15, 23, 42, 0.4); color: #818cf8; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
		td { color: #e2e8f0; font-size: 15px; }
		.delete-btn { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
		.delete-btn:hover { background: #ef4444; color: white; }
	</style>
</head>
<body>

<div class="container">
	<div class="header">
		<h1>👨‍🏫 Professor Workspace</h1>
		<button onclick="handleLogout()" class="logout-btn">Secure Logout</button>
	</div>

	<div class="form-card">
		<h3>Enroll New Academic Record</h3>
		<form onsubmit="addStudent(event)">
			<div class="form-group">
				<input type="text" id="studentName" placeholder="Enter Full Student Name" required autocomplete="off">
				<button type="submit" class="add-btn">Generate & Add</button>
			</div>
		</form>
	</div>

	<div class="table-card">
		<table>
			<thead>
				<tr>
					<th>Roll No</th>
					<th>Student Name</th>
					<th>Date Registered</th>
					<th>Status</th>
					<th>Operations</th>
				</tr>
			</thead>
			<tbody id="attendanceTableBody">
				</tbody>
		</table>
	</div>
</div>

<script>
// Minimal inline script to support form actions when script.js is not present
function formatDate(d){const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`}
function addStudent(e){e.preventDefault();const name=document.getElementById('studentName').value.trim();if(!name) return;const tbody=document.getElementById('attendanceTableBody');const row=document.createElement('tr');const roll=Math.floor(1000+Math.random()*9000);
row.innerHTML=`<td>${roll}</td><td>${name}</td><td>${formatDate(new Date())}</td><td>Active</td><td><button class="delete-btn" onclick="this.closest('tr').remove()">Remove</button></td>`;
tbody.prepend(row);document.getElementById('studentName').value='';}
function handleLogout(){alert('You have been securely logged out.');location.reload();}
</script>
</body>
</html>
