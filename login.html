<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPG ERP - Centralized Login Gateway</title>
    <style>
        /* ==================== CORE SYSTEM THEME TOKENS ==================== */
        :root {
            --bg-base-mainframe: #070a13;
            --bg-card-surface: #0f172a;
            --accent-indigo-glow: #6366f1;
            --accent-indigo-hover: #4f46e5;
            --text-primary-white: #f8fafc;
            --text-muted-slate: #94a3b8;
            --border-glass-line: rgba(255, 255, 255, 0.08);
            --error-red: #ef4444;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-base-mainframe);
            color: var(--text-primary-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* ==================== SCREEN STRUCTURAL CARD ==================== */
        .login-card-viewport {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border: 1px solid var(--border-glass-line);
            border-radius: 16px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            box-sizing: border-box;
        }
        .login-card-viewport h2 { margin: 0 0 8px 0; font-size: 24px; font-weight: 700; }
        .login-card-viewport p { color: var(--text-muted-slate); font-size: 13px; margin: 0 0 24px 0; }

        /* Segmented Role Selector */
        .role-selector-tabs {
            display: flex; gap: 10px; margin-bottom: 24px; background: rgba(0,0,0,0.25); padding: 4px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .role-btn {
            flex: 1; padding: 11px; background: transparent; border: none; color: var(--text-muted-slate); font-weight: 600; cursor: pointer; border-radius: 6px; font-size: 13px; transition: all 0.2s;
        }
        .role-btn.active { background: var(--accent-indigo-glow); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25); }

        /* Input Controllers Layout */
        .input-control-block { text-align: left; margin-bottom: 20px; }
        .input-control-block label { display: block; font-size: 11px; color: var(--text-muted-slate); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-input-field {
            width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-glass-line); padding: 12px; border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box; outline: none; transition: border 0.2s;
        }
        .form-input-field:focus { border-color: var(--accent-indigo-glow); }

        .login-error-log { color: var(--error-red); font-size: 13px; margin-bottom: 16px; display: none; text-align: left; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 6px; border: 1px solid rgba(239, 68, 68, 0.2); }

        .action-submit-btn {
            width: 100%; background: var(--accent-indigo-glow); border: none; color: #fff; padding: 14px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s; margin-top: 8px;
        }
        .action-submit-btn:hover { background: var(--accent-indigo-hover); }
    </style>
</head>
<body>

<div class="login-card-viewport">
    <h2>DPG ERP Gateway</h2>
    <p>Security Access Matrix Token Verification</p>
    
    <div class="role-selector-tabs">
        <button id="roleProfBtn" class="role-btn active" onclick="switchLoginRole('professor')">Professor Mode</button>
        <button id="roleStudBtn" class="role-btn" onclick="switchLoginRole('student')">Student Mode</button>
    </div>
    
    <div id="authValidationLog" class="login-error-log">⚠️ Invalid Username or Password pattern!</div>
    
    <div class="input-control-block">
        <label id="identityInputLabel">Faculty Identity Name</label>
        <input type="text" id="authIdentityField" class="form-input-field" placeholder="e.g., Rajesh">
    </div>
    
    <div class="input-control-block">
        <label>Security Access Key</label>
        <input type="password" id="authSecretField" class="form-input-field" placeholder="e.g., Rajesh123">
    </div>
    
    <button class="action-submit-btn" onclick="executeSystemAuthentication()">Verify & Authorize Session</button>
</div>

<script>
    let currentRoleContext = 'professor';

    // Static Dictionary matching the names we embedded in our main platform architecture
    const allowedProfessors = ["Rajesh", "Sunita", "Amit"];
    const allowedStudents = ["Aman", "Sneha", "Rohan"];

    // 1. Role Toggle Handler
    function switchLoginRole(targetRole) {
        currentRoleContext = targetRole;
        document.getElementById('roleProfBtn').classList.remove('active');
        document.getElementById('roleStudBtn').classList.remove('active');
        document.getElementById('authValidationLog').style.display = 'none';

        if(targetRole === 'professor') {
            document.getElementById('roleProfBtn').classList.add('active');
            document.getElementById('identityInputLabel').innerText = "Faculty Identity Name";
            document.getElementById('authIdentityField').placeholder = "e.g., Rajesh";
        } else {
            document.getElementById('roleStudBtn').classList.add('active');
            document.getElementById('identityInputLabel').innerText = "Student Registered Name";
            document.getElementById('authIdentityField').placeholder = "e.g., Aman";
        }
    }

    // 2. LocalStorage Token Generation & Verification
    function executeSystemAuthentication() {
        const usernameInput = document.getElementById('authIdentityField').value.trim();
        const passwordInput = document.getElementById('authSecretField').value.trim();
        const errorLog = document.getElementById('authValidationLog');

        if (currentRoleContext === 'professor') {
            // Check if name matches list and password follows Name+123 constraint
            const matchedProf = allowedProfessors.find(p => 
                p.toLowerCase() === usernameInput.toLowerCase() && 
                (p + "123").toLowerCase() === passwordInput.toLowerCase()
            );

            if (matchedProf) {
                errorLog.style.display = 'none';
                // Save routing state tokens securely into temporary LocalStorage memory
                localStorage.setItem('activeUserRole', 'professor');
                localStorage.setItem('activeUserName', matchedProf);
                
                // Redirect directly to your main workspace matrix terminal file
                window.location.href = "professor.html"; 
            } else {
                errorLog.style.display = 'block';
            }
        } else {
            // Student verification block
            const matchedStudent = allowedStudents.find(s => 
                s.toLowerCase() === usernameInput.toLowerCase() && 
                (s + "123").toLowerCase() === passwordInput.toLowerCase()
            );

            if (matchedStudent) {
                errorLog.style.display = 'none';
                localStorage.setItem('activeUserRole', 'student');
                localStorage.setItem('activeUserName', matchedStudent);
                
                // Routes to the same platform file, which auto-adjusts its layout parameters
                window.location.href = "professor.html"; 
            } else {
                errorLog.style.display = 'block';
            }
        }
    }
</script>

</body>
</html>
