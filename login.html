<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Portal | Secured Login</title>
    <style>
        /* Premium Typography & Variable Setup */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glow Background Spheres */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.15);
            filter: blur(100px);
            z-index: 0;
        }
        body::before { top: -10%; left: -10%; background: rgba(168, 85, 247, 0.15); }
        body::after { bottom: -10%; right: -10%; }

        /* Glassmorphism Login Container */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-header h2 {
            color: var(--text-main);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* High-Tech Input Shells */
        select, input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Style Select Options for dark background consistency */
        select option {
            background-color: #1e1b4b;
            color: var(--text-main);
        }

        select:focus, input:focus {
            border-color: #818cf8;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        /* Futuristic Action Button */
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.4);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(79, 70, 229, 0.5);
            background: linear-gradient(135deg, #818cf8 0%, #4338ca 100%);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Entrance Animation CSS */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h2>Portal Secure SignIn</h2>
            <p>Access your academic analytics core terminal</p>
        </div>

        <div class="form-group">
            <label for="role">User Configuration Profile</label>
            <select id="role">
                <option value="professor">👨‍🏫 Faculty Member / Professor</option>
                <option value="student">👨‍🎓 Academic Scholar / Student</option>
            </select>
        </div>

        <div class="form-group">
            <label for="password">Security Access Token</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button onclick="handleLogin()" class="login-btn">Authenticate Session</button>
    </div>
</div>

<script>
function handleLogin() {
    const role = document.getElementById("role").value;
    const password = document.getElementById("password").value;

    if (role === "professor" && password === "admin123") {
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("userRole", "professor");
        window.location.href = "professor.html"; // Ye file sahi folder mein honi chahiye
    } else if (role === "student" && password === "student123") {
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("userRole", "student");
        window.location.href = "student.html";   // Ye file sahi folder mein honi chahiye
    } else {
        alert("Authentication Terminated: Invalid Access Credentials.");
    }
}
</script>

</body>
</html>
